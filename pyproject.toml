[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volscope"
version = "0.1.0"
description = "Native Volatility 3 investigation workspace"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7", "volatility3>=2.28,<3"]

[project.scripts]
volscope = "volscope.app:main"

[tool.setuptools.packages.find]
where = ["src"]
